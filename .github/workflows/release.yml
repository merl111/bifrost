name: Linux release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test both delivered artifacts
        run: |
          docker build --progress=plain --target verified -f packaging/Dockerfile -t bifrost-release .
          container=$(docker create bifrost-release)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p dist
          docker cp "$container:/out/." dist/
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-x86_64
          path: dist
      - name: Verify tag and publish tested files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag does not match binary version'; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft > ../release.json 2>/dev/null; then
            # A rerun can finish a draft, but must never replace a published release.
            jq -e '.isDraft == true' ../release.json
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            gh release create "$RELEASE_TAG" ./* --verify-tag --draft \
              --title "Bifrost $version" --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
